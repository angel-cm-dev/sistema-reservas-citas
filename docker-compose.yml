# Levanta todo el sistema: docker compose up --build
# Frontend: http://localhost:8080  ·  API/Swagger: http://localhost:8000/docs
name: reservas-citas

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
      POSTGRES_USER: ${POSTGRES_USER:-reservas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservas_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reservas}:${POSTGRES_PASSWORD:-reservas_dev}@db:5432/${POSTGRES_DB:-reservas}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-minimo-32-caracteres}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TIMEZONE: ${TIMEZONE:-America/Lima}
      SEED_ON_START: ${SEED_ON_START:-true}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
